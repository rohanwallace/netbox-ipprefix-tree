[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ipprefix-tree"
version = "0.1.4"
requires-python = ">=3.12.0"
authors = [
    {name = "Rohan Wallace"},
]
license = "Apache-2.0"

description = "Display Netbox IP Prefixes as a tree view"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."netbox_plugins"]
netbox_ipprefix_tree = "netbox_ipprefix_tree:IPPrefixTreeConfig"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_ipprefix_tree*"]

[tool.setuptools.package-data]
netbox_ipprefix_tree = [
    "templates/**/*",
    "static/**/*",
    "locale/**/*.mo"
]
